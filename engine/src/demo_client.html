<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collision Client</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="world"></canvas>
  <script>
    let canvas = document.getElementById("world");
    let ctx = canvas.getContext("2d");
    let room_size = 0, ratio = 0, my_id = null;
    let entities = {};
    let camera = { x: 0, y: 0 };
    let keys = {};
    let ws = null;
    let last_dir = -1;

    window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
    window.dispatchEvent(new Event("resize"));

    window.addEventListener("keydown", e => { keys[e.key] = true; update_input(); });
    window.addEventListener("keyup", e => { keys[e.key] = false; update_input(); });
    
    window.addEventListener("wheel", e => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        let delta = e.deltaY < 0 ? 2.0 : -2.0;
        let buf = new ArrayBuffer(5);
        let view = new DataView(buf);
        view.setUint8(0, 1);
        view.setFloat32(1, delta, true);
        ws.send(buf);
    });

    function update_input() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        let x = (keys["ArrowRight"] || keys["d"] ? 1 : 0) - (keys["ArrowLeft"] || keys["a"] ? 1 : 0);
        let y = (keys["ArrowDown"] || keys["s"] ? 1 : 0) - (keys["ArrowUp"] || keys["w"] ? 1 : 0);
        let dir = 8;
        if (x == 1 && y == 0) dir = 0;
        else if (x == -1 && y == 0) dir = 1;
        else if (x == 0 && y == 1) dir = 2;
        else if (x == 0 && y == -1) dir = 3;
        else if (x == 1 && y == 1) dir = 4;
        else if (x == 1 && y == -1) dir = 5;
        else if (x == -1 && y == 1) dir = 6;
        else if (x == -1 && y == -1) dir = 7;

        if (dir !== last_dir) {
            last_dir = dir;
            ws.send(new Uint8Array([0, dir]));
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let hw = canvas.width / 2, hh = canvas.height / 2;
        ctx.lineWidth = 3;
        ctx.strokeStyle = "red";
        
        let sx = Math.max(0, Math.floor((camera.x - hw) / ratio) * ratio);
        let ex = Math.min(room_size, Math.ceil((camera.x + hw) / ratio) * ratio);
        let sy = Math.max(0, Math.floor((camera.y - hh) / ratio) * ratio);
        let ey = Math.min(room_size, Math.ceil((camera.y + hh) / ratio) * ratio);

        for (let x = sx; x <= ex; x += ratio) {
            ctx.beginPath();
            ctx.moveTo(x - camera.x + hw, Math.max(0, -camera.y + hh));
            ctx.lineTo(x - camera.x + hw, Math.min(canvas.height, room_size - camera.y + hh));
            ctx.stroke();
        }
        for (let y = sy; y <= ey; y += ratio) {
            ctx.beginPath();
            ctx.moveTo(Math.max(0, -camera.x + hw), y - camera.y + hh);
            ctx.lineTo(Math.min(canvas.width, room_size - camera.x + hw), y - camera.y + hh);
            ctx.stroke();
        }

        ctx.lineWidth = 1;
        for (let id in entities) {
            let e = entities[id];
            ctx.fillStyle = Number(id) == my_id ? "cyan" : "lime";
            ctx.strokeStyle = "black";
            ctx.beginPath();
            ctx.arc(e.x - camera.x + hw, e.y - camera.y + hh, e.radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
        }
    }

    function loop() {
        for (let id in entities) {
            entities[id].x += (entities[id].tx - entities[id].x) * 0.3;
            entities[id].y += (entities[id].ty - entities[id].y) * 0.3;
        }
        if (my_id !== null && entities[my_id]) {
            camera.x = entities[my_id].x;
            camera.y = entities[my_id].y;
        }
        draw();
        requestAnimationFrame(loop);
    }
    loop();

    function connect() {
        // Set whatever websocket url you have.
        ws = new WebSocket("ws://localhost:8080/");
        ws.binaryType = "arraybuffer";
        ws.onmessage = e => {
            let view = new DataView(e.data);
            if (view.getUint8(0) == 0) {
                room_size = view.getFloat32(1, true);
                ratio = room_size / view.getUint32(5, true);
                my_id = view.getUint32(9, true);
            } else if (view.getUint8(0) == 1) {
                let seen = new Set();
                for (let i = 1; i < e.data.byteLength; i += 17) {
                    let id = view.getUint32(i, true);
                    let tx = view.getFloat32(i + 4, true);
                    let ty = view.getFloat32(i + 8, true);
                    let r = view.getFloat32(i + 12, true);
                    seen.add(id);
                    if (entities[id]) {
                        entities[id].tx = tx;
                        entities[id].ty = ty;
                        entities[id].radius = r;
                    } else {
                        entities[id] = { x: tx, y: ty, tx, ty, radius: r };
                    }
                }
                for (let id in entities) {
                    if (!seen.has(Number(id))) delete entities[id];
                }
            }
        };
        ws.onclose = () => setTimeout(connect, 1000);
    }
    connect();
  </script>
</body>
</html>
